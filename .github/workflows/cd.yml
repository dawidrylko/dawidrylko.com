name: Continuous Deployment

on:
  push:
    branches: ['master']

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Pinned with its checksum: the CV build must not drift under us, and the
  # tarball is fetched from the network on every run.
  TECTONIC_VERSION: '0.17.0'
  TECTONIC_SHA256: '8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7'

concurrency:
  group: 'cd'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Astro's build cache (incremental asset/image processing via sharp and the
      # webmanifest icon generation). Keyed on the inputs that change the output;
      # Astro re-validates entries by content hash, so a stale restore is safe.
      - name: Cache Astro build cache
        uses: actions/cache@v6
        with:
          path: |
            .astro
            node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('src/**', 'content/**', 'astro.config.mjs', 'pnpm-lock.yaml') }}
          restore-keys: |
            astro-${{ runner.os }}-

      # The CV PDFs (/resume-pl.pdf, /resume-en.pdf) are gitignored build output
      # compiled from resume/*.tex by `pnpm build`. Tectonic is a single static
      # binary that fetches only the LaTeX packages this document needs, so it
      # costs seconds where a full TeX Live install costs minutes.
      - name: Cache Tectonic packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-${{ hashFiles('resume/**') }}
          restore-keys: |
            tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-

      - name: Install Tectonic
        run: |
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location "$url" --output /tmp/tectonic.tar.gz
          echo "${TECTONIC_SHA256}  /tmp/tectonic.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/tectonic.tar.gz -C "$HOME/.local/bin" tectonic
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/tectonic" --version

      - name: Build
        run: pnpm run build

      - name: Diagnose search quality setup
        run: pnpm run doctor:search-quality

      - name: Validate structured-data graph
        run: pnpm run check:structured-data

      - name: Verify Google Search quality
        uses: SilesianSolutions/search-quality-kit/action@v0
        with:
          node-version-file: '.nvmrc'
          package-manager: pnpm
          config: search-quality.config.ts
          summary: 'true'
          upload-artifact: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: "!contains(github.event.head_commit.message, '[skip notify]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Notifications run after a successful deploy; a failure here must never
      # roll back or block the already-published build, so they are non-blocking.
      - name: Notify Bing via URL Submission API
        continue-on-error: true
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        working-directory: 'scripts/notify'
        shell: bash
        run: ./bing.sh
