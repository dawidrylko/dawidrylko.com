name: Continuous Integration

on:
  pull_request:

# Least-privilege default for GITHUB_TOKEN across all jobs; none of them write
# to the repo (dependency-review only needs to read the dependency graph).
permissions:
  contents: read

env:
  # Pinned with its checksum: the CV build must not drift under us, and the
  # tarball is fetched from the network on every run.
  TECTONIC_VERSION: '0.17.0'
  TECTONIC_SHA256: '8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7'

concurrency:
  group: 'ci-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Source-level static analysis. No build — these never need the artifact.
  # All checks share one dependency install (deps are the dominant cost). Each
  # check is guarded by `if: ${{ !cancelled() }}` so a failure in one still lets
  # the rest run and report — preserving the old matrix's fail-fast: false UX.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm run type:check

      - name: Lint check
        if: ${{ !cancelled() }}
        run: pnpm run lint:check

      - name: CSS lint check
        if: ${{ !cancelled() }}
        run: pnpm run lint:css

      - name: No scoped styles in .astro
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-no-scoped-styles.mjs

      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      - name: Contrast (WCAG AA)
        if: ${{ !cancelled() }}
        run: pnpm run a11y:contrast

  # Unit tests (Vitest) for the framework-agnostic logic in src/lib. No build —
  # these run directly against the source.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test

  # Blocks AI attribution (Co-Authored-By: Claude, Claude-Session, "Generated
  # with Claude Code", …) in commit messages and the PR title/description, per
  # CLAUDE.md. Zero deps, no build. fetch-depth: 0 so base..head resolves.
  attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check commit messages and PR title/description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-no-ai-attribution.mjs

  # Newly introduced vulnerable or incompatibly-licensed dependencies are
  # blocked at the PR that adds them.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # Single production build (astro build, incl. the zod frontmatter validation
  # in the content collection) producing the dist/ artifact every downstream
  # job reuses — so the build is never duplicated.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Astro's build cache (incremental asset/image processing via sharp and the
      # webmanifest icon generation). Keyed on the inputs that change the output;
      # Astro re-validates entries by content hash, so a stale restore is safe.
      - name: Cache Astro build cache
        uses: actions/cache@v6
        with:
          path: |
            .astro
            node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('src/**', 'content/**', 'astro.config.mjs', 'pnpm-lock.yaml') }}
          restore-keys: |
            astro-${{ runner.os }}-

      # The CV PDFs (/resume-pl.pdf, /resume-en.pdf) are gitignored build output
      # compiled from resume/*.tex by `pnpm build`. Tectonic is a single static
      # binary that fetches only the LaTeX packages this document needs, so it
      # costs seconds where a full TeX Live install costs minutes.
      - name: Cache Tectonic packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-${{ hashFiles('resume/**') }}
          restore-keys: |
            tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-

      - name: Install Tectonic
        run: |
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location "$url" --output /tmp/tectonic.tar.gz
          echo "${TECTONIC_SHA256}  /tmp/tectonic.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/tectonic.tar.gz -C "$HOME/.local/bin" tectonic
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/tectonic" --version

      - name: Build
        run: pnpm run build

      - name: Diagnose search quality setup
        run: pnpm run doctor:search-quality

      - name: Verify Google Search quality
        uses: SilesianSolutions/search-quality-kit@v0
        with:
          node-version-file: '.nvmrc'
          package-manager: pnpm
          config: search-quality.config.ts
          summary: 'true'
          upload-artifact: 'true'

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # Build-output contracts on dist/: required distribution artifacts (RSS,
  # sitemap, manifest, core pages, social meta), URL parity with content/pl,
  # and the rendering-regression contract from the migration QA.
  build-contract:
    name: Build-output contract
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Verify distribution contract
        run: node scripts/ci/check-build-output.mjs

      - name: Verify URL parity with content/pl
        run: node scripts/ci/check-astro-url-parity.mjs

      - name: Verify rendering-regression contract
        run: node scripts/ci/check-astro-build-output.mjs

      - name: Verify SEO / structured-data contract
        run: node scripts/ci/check-seo-meta.mjs

      - name: Verify crawl-hygiene contract
        run: node scripts/ci/check-crawl-hygiene.mjs

      - name: Verify PL/EN language strategy contract
        run: node scripts/ci/check-lang-attributes.mjs

      - name: Verify SEO title/description lengths
        run: node scripts/ci/check-seo-lengths.mjs

      - name: Verify consent contract
        run: node scripts/ci/check-consent-contract.mjs

      - name: Verify image weight budget
        run: node scripts/ci/check-image-budget.mjs

      - name: Verify JS bundle budget
        run: node scripts/ci/check-bundle-budget.mjs

  # Internal link integrity across the built site (catches broken links and
  # broken redirects). External URLs are skipped to keep the gate deterministic.
  links:
    name: Link check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Check internal links
        run: pnpm dlx linkinator@6.1.2 dist --recurse --skip "^https?://(?!localhost)"

  # Rendered-page audit (Lighthouse) of the app-owned pages: accessibility, SEO
  # and performance are gated (performance on the median of three runs);
  # best-practices stays advisory. ubuntu-latest ships Chrome, which Lighthouse
  # auto-detects.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Serve build output
        run: |
          pnpm dlx http-server@14.1.1 dist -p 9000 -s &
          npx --yes wait-on@8.0.1 http://localhost:9000/ --timeout 30000

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

  # End-to-end and axe-core accessibility smoke tests (Playwright) against the
  # built site served by `astro preview`. Reuses the dist/ artifact.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm run test:e2e

  # Dependabot pull requests only (see README > "Dependency updates"). A
  # formatter or linter release often changes nothing but style, so the fixers
  # run on the updated packages with a read-only token and hand over a patch.
  # GitHub Actions updates change no package, so they skip it.
  autofix:
    name: Dependabot autofix
    if: >-
      github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply lint fixes, leaving the rest to the lint checks
        run: |
          pnpm exec eslint . --fix || true
          pnpm exec stylelint "src/**/*.css" --fix || true

      - name: Apply formatting
        run: pnpm run format:write

      - name: Collect patch
        id: patch
        run: |
          git diff --binary > "$RUNNER_TEMP/autofix.patch"
          if [ -s "$RUNNER_TEMP/autofix.patch" ]; then
            git diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          retention-days: 7

  # Installs nothing and runs no updated package: it checks the patch against
  # the path guard from the pull request head, applies it and pushes it as
  # rylkobot. The push starts a new CI run, which decides the merge.
  autofix-push:
    name: Dependabot autofix push
    needs: autofix
    if: needs.autofix.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the rylkobot token
        env:
          RYLKOBOT_TOKEN: ${{ secrets.RYLKOBOT_TOKEN }}
        run: |
          if [ -z "$RYLKOBOT_TOKEN" ]; then
            echo "::error::The RYLKOBOT_TOKEN Dependabot secret is not set. The patch is attached to this run as the autofix-patch artifact."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.RYLKOBOT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Download patch
        uses: actions/download-artifact@v8
        with:
          name: autofix-patch
          path: ${{ runner.temp }}

      - name: Refuse changes to content, workflows and manifests
        run: git apply --numstat "$RUNNER_TEMP/autofix.patch" | node scripts/ci/check-autofix-paths.mjs

      - name: Apply patch
        run: git apply --index "$RUNNER_TEMP/autofix.patch"

      - name: Commit and push as rylkobot
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name rylkobot
          git config user.email 204860200+rylkobot@users.noreply.github.com
          git commit -m "style: apply formatter and lint fixes after dependency update"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

  # Enables native auto-merge for a green minor or patch update. GitHub then
  # merges once every required check of the ruleset passes, including the
  # pr-meta ones this workflow cannot wait for. It runs with the rylkobot token,
  # not GITHUB_TOKEN, so the merge push starts the deployment. A major update,
  # a red check, a failed or refused autofix, or an unreadable update type is
  # assigned to the owner instead. No checkout: nothing from the pull request
  # runs next to the token.
  dependabot:
    name: Dependabot merge
    needs:
      - static
      - unit
      - attribution
      - dependency-review
      - build
      - build-contract
      - links
      - lighthouse
      - e2e
      - autofix
      - autofix-push
    if: ${{ !cancelled() && github.event.pull_request.user.login == 'dependabot[bot]' && needs.autofix-push.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require the rylkobot token
        env:
          RYLKOBOT_TOKEN: ${{ secrets.RYLKOBOT_TOKEN }}
        run: |
          if [ -z "$RYLKOBOT_TOKEN" ]; then
            echo "::error::RYLKOBOT_TOKEN is not set as a Dependabot secret or an Actions secret."
            exit 1
          fi

      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        continue-on-error: true

      - name: Enable auto-merge for minor and patch updates, assign the rest
        env:
          GH_TOKEN: ${{ secrets.RYLKOBOT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULTS: >-
            ${{ needs.static.result }} ${{ needs.unit.result }} ${{ needs.attribution.result }}
            ${{ needs.dependency-review.result }} ${{ needs.build.result }} ${{ needs.build-contract.result }}
            ${{ needs.links.result }} ${{ needs.lighthouse.result }} ${{ needs.e2e.result }}
          AUTOFIX_RESULTS: ${{ needs.autofix.result }} ${{ needs.autofix-push.result }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          checks=success
          for result in $RESULTS; do
            [ "$result" = success ] || checks=failure
          done
          for result in $AUTOFIX_RESULTS; do
            [ "$result" = success ] || [ "$result" = skipped ] || checks=failure
          done
          echo "checks=$checks results=[$RESULTS] autofix=[$AUTOFIX_RESULTS] update-type=${UPDATE_TYPE:-unknown}"
          case "$checks/$UPDATE_TYPE" in
            success/version-update:semver-minor | success/version-update:semver-patch)
              gh pr merge "$PR_URL" --auto --merge --match-head-commit "$HEAD_SHA"
              ;;
            *)
              gh pr edit "$PR_URL" --add-assignee dawidrylko
              ;;
          esac
