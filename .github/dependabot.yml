version: 2
updates:
  - package-ecosystem: 'npm' # covers npm/yarn/pnpm; resolved via pnpm-lock.yaml
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Europe/Warsaw'
    # Single grouped PR for every weekly version update.
    open-pull-requests-limit: 1
    assignees:
      - 'dawidrylko'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - '*'
    ignore:
      # katex is intentionally held back for now — a newer major is a breaking
      # change we are not ready to adopt yet. Bump it manually when ready.
      - dependency-name: 'katex'
      # TypeScript majors are held back until the toolchain catches up with the
      # native compiler: `astro check` needs the programmatic API that TS 7 does
      # not ship (withastro/roadmap#1321) and typescript-eslint does not support
      # TS 7 yet (typescript-eslint#10940). Minor and patch 6.x updates still flow.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 1
    assignees:
      - 'dawidrylko'
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      all-actions:
        applies-to: version-updates
        patterns:
          - '*'
